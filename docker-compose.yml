version: '3.8'

services:
  db:
    image: postgres:15
    container_name: civicseva-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=swasthgram_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=batchu123
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: civicseva-backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_DB=swasthgram_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=batchu123
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    container_name: civicseva-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - WDS_SOCKET_PORT=3000
    stdin_open: true
    tty: true

volumes:
  postgres_data:
